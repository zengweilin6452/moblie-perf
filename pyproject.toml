[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobile-perf"
version = "0.1.0"
description = "App 性能采集组件：基于 SoloPi 端侧采集的会话、归档与指标闭环"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
mobile-perf = "mobile_perf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "device: 需要真机与 adb 的测试(无设备不运行、不计为通过)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
